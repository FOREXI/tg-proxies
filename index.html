<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyPulse - MTProto Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #060814 0%, #0b111e 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px rgba(255, 255, 255, 0.04) solid;
        }
        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.35);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.08);
            transform: translateY(-2px);
        }
        .active-tab {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between pb-24 selection:bg-blue-500/30">

    <div>
        <header class="container mx-auto px-4 pt-14 pb-8 text-center relative">
            <p class="text-xs font-mono tracking-widest text-blue-500 uppercase font-semibold mb-2">
                MTProto Check For Telegram
            </p>
            <h1 class="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-cyan-400 mb-4 font-mono">
                ProxyPulse
            </h1>
            <p class="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed">
                سنجش پینگ زنده، مرتب‌سازی هوشمند بر اساس سرعت و خروجی تجمیعی پایداری شبکه.
            </p>
            
            <div id="update-status" class="mt-6 text-[11px] bg-slate-900/90 border border-slate-800/60 inline-flex items-center gap-2 px-4 py-2 rounded-full text-slate-400 font-medium">
                <i class="fa-solid fa-satellite-dish animate-pulse text-blue-400"></i> در حال اتصال به مخازن شبکه...
            </div>
        </header>

        <div class="container mx-auto px-4 max-w-md mb-8">
            <div class="bg-slate-950/60 p-1.5 rounded-2xl border border-slate-900 flex gap-1 text-xs font-bold">
                <button onclick="switchTab('all')" id="tab-all" class="flex-1 py-3 rounded-xl text-center transition-all duration-200 active-tab">
                    همه (<span id="count-all">0</span>)
                </button>
                <button onclick="switchTab('alive')" id="tab-alive" class="flex-1 py-3 rounded-xl text-center text-slate-400 hover:text-slate-200 transition-all duration-200 border border-transparent">
                    زنده (<span id="count-alive" class="text-green-400">0</span>)
                </button>
                <button onclick="switchTab('dead')" id="tab-dead" class="flex-1 py-3 rounded-xl text-center text-slate-400 hover:text-slate-200 transition-all duration-200 border border-transparent">
                    قطع (<span id="count-dead" class="text-red-400">0</span>)
                </button>
            </div>
        </div>

        <main class="container mx-auto px-4 max-w-6xl">
            <div id="loading-state" class="text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-slate-800 border-t-blue-500 mb-4"></div>
                <p class="text-xs text-slate-500 font-mono">Fetching database from secure sources...</p>
            </div>

            <div id="proxies-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 transition-all duration-300"></div>
        </main>
    </div>

    <div class="fixed bottom-6 left-6 right-6 z-50 flex justify-between items-center pointer-events-none">
        <button onclick="startBulkPing()" class="pointer-events-auto flex items-center justify-center bg-slate-900 border border-slate-800 text-slate-300 hover:text-white p-3.5 rounded-2xl shadow-xl transition-all active:scale-95 group" title="سنجش مجدد پینگ">
            <i class="fa-solid fa-arrows-rotate text-base group-hover:rotate-180 transition-transform duration-500"></i>
        </button>

        <button onclick="copyAllAlive()" id="btn-bulk-copy" class="hidden pointer-events-auto flex items-center gap-2.5 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold text-xs py-3.5 px-5 rounded-2xl shadow-xl shadow-blue-950/40 transition-all transform active:scale-95">
            <i class="fa-solid fa-layer-group text-sm"></i>
            <span>کپی تجمیعی زنده ها</span>
        </button>
    </div>

    <footer class="w-full text-center py-10 border-t border-slate-950 mt-16">
        <p class="text-xs tracking-widest text-slate-600 uppercase font-mono">
            Made with ♥️ by Saeed
        </p>
    </footer>

    <script>
        const primaryUrl = 'https://cdn.jsdelivr.net/gh/SoliSpirit/mtproto@master/all_proxies.txt';
        const fallbackUrl = 'https://raw.githubusercontent.com/SoliSpirit/mtproto/master/all_proxies.txt';
        
        let allProxies = [];
        let currentTab = 'all';

        async function fetchProxies() {
            let textData = '';
            
            try {
                // تلاش اول: دریافت از CDN ضد فیلتر
                document.getElementById('update-status').innerHTML = `<i class="fa-solid fa-satellite-dish animate-pulse text-blue-400"></i> در حال تلاش برای اتصال به مخزن اول (CDN)...`;
                const response = await fetch(primaryUrl);
                if (!response.ok) throw new Error('CDN Failed');
                textData = await response.text();
                console.log('Data fetched from Primary CDN');
            } catch (error) {
                // تلاش دوم: اگر اولی ارور داد، سوئیچ روی گیت‌هاب مستقیم
                try {
                    document.getElementById('update-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> مخزن اول ناموفق بود. سوئیچ به مخزن پشتیبان (GitHub)...`;
                    const response = await fetch(fallbackUrl);
                    if (!response.ok) throw new Error('Fallback Failed');
                    textData = await response.text();
                    console.log('Data fetched from Fallback GitHub');
                } catch (fallbackError) {
                    // اگر هر دو مخزن روی اینترنت کاربر بلاک بودند
                    document.getElementById('loading-state').innerHTML = `
                        <i class="fa-solid fa-circle-exclamation text-red-500 text-2xl mb-2"></i>
                        <p class="text-xs text-red-400 font-mono">هر دو مخزن اصلی و پشتیبان روی شبکه شما مسدود هستند.</p>
                    `;
                    return;
                }
            }
            
            const lines = textData.split('\n')
                .map(line => line.trim())
                .filter(line => line.startsWith('tg://proxy') || line.startsWith('https://t.me/proxy'));
            
            // جلوگیری از ورود دیتای تکراری با استفاده از Set
            const uniqueLines = [...new Set(lines)];
            
            allProxies = uniqueLines.map((link, idx) => {
                const parsed = parseProxyLink(link);
                return parsed ? { ...parsed, id: idx, status: 'testing', ping: null } : null;
            }).filter(p => p !== null);

            document.getElementById('count-all').innerText = allProxies.length;
            document.getElementById('loading-state').style.display = 'none';
            
            renderProxies();
            startBulkPing();
        }

        function parseProxyLink(link) {
            try {
                const urlObj = new URL(link.replace('tg://', 'https://'));
                return {
                    server: urlObj.searchParams.get('server'),
                    port: urlObj.searchParams.get('port'),
                    secret: urlObj.searchParams.get('secret'),
                    original: link
                };
            } catch (e) { return null; }
        }

        async function measurePing(server) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const startTime = performance.now();
            
            try {
                await fetch(`https://${server}/favicon.ico?p=${Math.random()}`, {
                    mode: 'no-cors',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return Math.round(performance.now() - startTime);
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name !== 'AbortError') {
                    return Math.round(performance.now() - startTime);
                }
                return null;
            }
        }

        function renderProxies() {
            const container = document.getElementById('proxies-container');
            container.innerHTML = '';

            let displayList = [...allProxies];

            displayList.sort((a, b) => {
                if (a.status === 'alive' && b.status === 'alive') return a.ping - b.ping;
                if (a.status === 'alive') return -1;
                if (b.status === 'alive') return 1;
                if (a.status === 'dead' && b.status !== 'dead') return 1;
                if (b.status === 'dead' && a.status !== 'dead') return -1;
                return 0;
            });

            const filtered = displayList.filter(p => {
                if (currentTab === 'all') return true;
                if (currentTab === 'alive') return p.status === 'alive';
                if (currentTab === 'dead') return p.status === 'dead';
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-600 text-xs font-medium">
                        <i class="fa-solid fa-cubes-stacked text-xl mb-2 block"></i>
                        هیچ پروکسی در این بخش یافت نشد.
                    </div>
                `;
                return;
            }

            filtered.forEach(proxy => {
                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden transition-all duration-300 ${proxy.status === 'dead' ? 'opacity-30 scale-[0.98]' : ''}`;
                
                let badgeClass = 'bg-slate-900 text-slate-500 border border-slate-800';
                let badgeContent = '<i class="fa-solid fa-circle-notch fa-spin text-[9px] mr-1"></i> Checking';
                let speedTag = '';

                if (proxy.status === 'alive') {
                    badgeClass = 'bg-green-500/10 text-green-400 border border-green-500/20 font-mono';
                    badgeContent = `${proxy.ping} ms`;
                    
                    if (proxy.ping < 120) speedTag = '<span class="bg-cyan-500/10 text-cyan-400 text-[9px] px-2 py-0.5 rounded-md font-bold">عالی ⚡</span>';
                    else if (proxy.ping < 250) speedTag = '<span class="bg-emerald-500/10 text-emerald-400 text-[9px] px-2 py-0.5 rounded-md font-bold">خوب 🟢</span>';
                    else speedTag = '<span class="bg-amber-500/10 text-amber-400 text-[9px] px-2 py-0.5 rounded-md font-bold">معمولی 🟡</span>';
                } else if (proxy.status === 'dead') {
                    badgeClass = 'bg-red-500/10 text-red-400 border border-red-500/20';
                    badgeContent = 'قطع ارتباط';
                }

                card.innerHTML = `
                    <div class="absolute top-0 left-0 bg-slate-950/80 border-b border-r border-slate-900 text-slate-600 text-[9px] px-2 py-0.5 rounded-br-xl font-mono">
                        #${proxy.id + 1}
                    </div>
                    <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5">
                        ${speedTag}
                        <div class="${badgeClass} text-[10px] px-2 py-0.5 rounded-md font-medium">
                            ${badgeContent}
                        </div>
                    </div>

                    <div class="mb-5 mt-6">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-8 h-8 rounded-xl bg-slate-950 flex items-center justify-center text-xs text-slate-400 border border-slate-900">
                                <i class="fa-solid fa-network-wired"></i>
                            </div>
                            <div class="overflow-hidden flex-1">
                                <h3 class="font-bold text-slate-300 text-xs font-mono truncate" title="${proxy.server}">${proxy.server}</h3>
                                <p class="text-[10px] text-slate-500 mt-0.5">Port: <span class="font-mono text-slate-400">${proxy.port}</span></p>
                            </div>
                        </div>
                        <div class="bg-slate-950/40 border border-slate-900 rounded-xl p-2.5 text-[10px] font-mono text-slate-500 flex justify-between items-center select-all">
                            <span class="truncate pr-4"><span class="text-indigo-400/50">Secret:</span> ${proxy.secret}</span>
                            <i class="fa-solid fa-key text-[9px] text-slate-700"></i>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="copySingle('${proxy.original}')" class="flex items-center justify-center gap-1.5 bg-slate-950/80 hover:bg-slate-900 text-slate-400 hover:text-slate-200 py-2 px-3 rounded-xl text-xs font-medium border border-slate-900 transition-colors">
                            <i class="fa-regular fa-copy"></i> کپی لینک
                        </button>
                        <a href="${proxy.original}" class="flex items-center justify-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white py-2 px-3 rounded-xl text-xs font-bold transition-all ${proxy.status === 'dead' ? 'pointer-events-none bg-slate-900 text-slate-600 border border-slate-900 shadow-none' : ''}">
                            <i class="fa-solid fa-bolt text-[10px]"></i> اتصال
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function startBulkPing() {
            const statusEl = document.getElementById('update-status');
            if(statusEl) statusEl.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i> در حال بروزرسانی و پینگ‌سنجی پروکسی‌ها...`;
            
            allProxies.forEach(p => { if(p.status !== 'alive') p.status = 'testing' });
            renderProxies();

            const pingPromises = allProxies.map(async (proxy) => {
                const ping = await measurePing(proxy.server);
                if (ping !== null) {
                    proxy.status = 'alive';
                    proxy.ping = ping;
                } else {
                    proxy.status = 'dead';
                }
                updateCounters();
                renderProxies();
            });

            await Promise.all(pingPromises);
            if(statusEl) statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> پینگ‌سنجی با موفقیت روی اپراتور شما انجام شد.`;
            
            const hasAlive = allProxies.some(p => p.status === 'alive');
            if (hasAlive) {
                document.getElementById('btn-bulk-copy').classList.remove('hidden');
            } else {
                document.getElementById('btn-bulk-copy').classList.add('hidden');
            }
        }

        function updateCounters() {
            document.getElementById('count-alive').innerText = allProxies.filter(p => p.status === 'alive').length;
            document.getElementById('count-dead').innerText = allProxies.filter(p => p.status === 'dead').length;
        }

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'alive', 'dead'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active-tab');
                document.getElementById(`tab-${t}`).classList.add('text-slate-400');
            });
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
            document.getElementById(`tab-${tab}`).classList.remove('text-slate-400');
            renderProxies();
        }

        function copySingle(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('پروکسی با موفقیت کپی شد 📋');
            });
        }

        function copyAllAlive() {
            const aliveProxies = allProxies.filter(p => p.status === 'alive').sort((a, b) => a.ping - b.ping);
            if (aliveProxies.length === 0) return;
            
            const bulkText = aliveProxies.map(p => p.original).join('\n');
            navigator.clipboard.writeText(bulkText).then(() => {
                showToast(`تعداد ${aliveProxies.length} پروکسی برتر یکجا کپی شد 🚀`);
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-6 bg-slate-950 border border-slate-800 text-slate-200 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold z-50 transition-all duration-300 transform translate-y-4 opacity-0';
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 100);
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        fetchProxies();
    </script>
</body>
</html>
