<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProxyPulse - MTProto Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #060814 0%, #0b111e 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px rgba(255, 255, 255, 0.04) solid;
      transition: all .2s ease;
    }
    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.35);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.08);
      transform: translateY(-2px);
    }
    .active-tab {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.4);
    }
  </style>
</head>

<body class="text-slate-200 min-h-screen flex flex-col justify-between pb-24 selection:bg-blue-500/30">

  <div>
    <header class="container mx-auto px-4 pt-14 pb-6 text-center relative">
      <p class="text-xs font-mono tracking-widest text-blue-500 uppercase font-semibold mb-2">MTProto Check For Telegram</p>
      <h1 class="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-cyan-400 mb-3 font-mono">
        ProxyPulse
      </h1>

      <div id="update-status" class="text-[11px] bg-slate-900/90 border border-slate-800/60 inline-flex items-center gap-2 px-4 py-2 rounded-full text-slate-400 font-medium mb-6">
        <i class="fa-solid fa-satellite-dish animate-pulse text-blue-400"></i>
        در حال اتصال به مخازن شبکه...
      </div>
    </header>

    <div class="container mx-auto px-4 max-w-xl mb-8">
      <div class="glass-card rounded-2xl p-4 border border-slate-800/50 flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-right">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-sm shadow-inner">
            <i class="fa-solid fa-globe"></i>
          </div>
          <div>
            <p class="text-[10px] text-slate-500 font-mono uppercase tracking-wider">آی‌پی شما</p>
            <h4 id="user-ip" class="font-mono text-sm font-bold text-slate-400">---</h4>
          </div>
        </div>

        <div class="sm:text-left">
          <p class="text-[10px] text-slate-500 font-mono uppercase tracking-wider">اپراتور اینترنت (ISP)</p>
          <h4 id="user-isp" class="text-xs font-bold text-indigo-400 truncate max-w-[180px]">نامشخص</h4>
        </div>

        <button id="btn-check-net" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold px-3 py-2 rounded-xl transition-all active:scale-95">
          <i class="fa-solid fa-circle-question"></i>
          بررسی وضعیت شبکه من
        </button>
      </div>
    </div>

    <div class="container mx-auto px-4 max-w-md mb-8">
      <div class="bg-slate-950/60 p-1.5 rounded-2xl border border-slate-900 flex gap-1 text-xs font-bold">
        <button data-tab="all" id="tab-all" class="flex-1 py-3 rounded-xl text-center transition-all duration-200 active-tab">
          همه (<span id="count-all">0</span>)
        </button>
        <button data-tab="alive" id="tab-alive" class="flex-1 py-3 rounded-xl text-center text-slate-400 hover:text-slate-200 transition-all duration-200 border border-transparent">
          زنده (<span id="count-alive" class="text-green-400">0</span>)
        </button>
        <button data-tab="dead" id="tab-dead" class="flex-1 py-3 rounded-xl text-center text-slate-400 hover:text-slate-200 transition-all duration-200 border border-transparent">
          قطع (<span id="count-dead" class="text-red-400">0</span>)
        </button>
      </div>
    </div>

    <main class="container mx-auto px-4 max-w-6xl">
      <div id="loading-state" class="text-center py-20">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-slate-800 border-t-blue-500 mb-4"></div>
        <p class="text-xs text-slate-500 font-mono">Fetching database from secure sources...</p>
      </div>

      <div id="proxies-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 transition-all duration-300"></div>
    </main>
  </div>

  <div id="qr-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
    <div id="qr-modal-panel" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-xs w-full text-center relative shadow-2xl transform scale-95 transition-transform duration-300">
      <button id="btn-close-qr" class="absolute top-3 left-3 text-slate-500 hover:text-slate-300 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-sm font-bold text-slate-300 mb-4 font-mono">Scan Proxy QR Code</h3>
      <div class="bg-white p-4 rounded-xl inline-block shadow-inner mb-4">
        <canvas id="qr-canvas"></canvas>
      </div>
      <p class="text-[11px] text-slate-400 leading-relaxed">
        دوربین گوشی را مقابل بارکد بگیرید تا پروکسی فوراً روی تلگرام شما فعال شود.
      </p>
    </div>
  </div>

  <div class="fixed bottom-6 left-6 right-6 z-50 flex justify-between items-center pointer-events-none">
    <button id="btn-refresh" class="pointer-events-auto flex items-center justify-center bg-slate-900 border border-slate-800 text-slate-300 hover:text-white p-3.5 rounded-2xl shadow-xl transition-all active:scale-95 group" title="سنجش مجدد پینگ">
      <i class="fa-solid fa-arrows-rotate text-base group-hover:rotate-180 transition-transform duration-500"></i>
    </button>

    <button id="btn-bulk-copy" class="hidden pointer-events-auto flex items-center gap-2.5 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold text-xs py-3.5 px-5 rounded-2xl shadow-xl shadow-blue-950/40 transition-all transform active:scale-95">
      <i class="fa-solid fa-layer-group text-sm"></i>
      <span>کپی تجمیعی زنده ها</span>
    </button>
  </div>

  <footer class="w-full text-center py-10 border-t border-slate-950 mt-16">
    <p class="text-xs tracking-widest text-slate-600 uppercase font-mono">Made with ♥️ by Saeed</p>
  </footer>

  <script>
    const primaryUrl = 'https://cdn.jsdelivr.net/gh/SoliSpirit/mtproto@master/all_proxies.txt';
    const fallbackUrl = 'https://raw.githubusercontent.com/SoliSpirit/mtproto/master/all_proxies.txt';

    let allProxies = [];
    let currentTab = 'all';
    let currentQRLink = '';

    const el = (id) => document.getElementById(id);

    function escapeHTML(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function safeText(node, value) {
      node.textContent = value ?? '';
    }

    function parseProxyLink(link) {
      try {
        const normalized = link.replace('tg://', 'https://');
        const urlObj = new URL(normalized);
        const server = urlObj.searchParams.get('server');
        const port = urlObj.searchParams.get('port');
        const secret = urlObj.searchParams.get('secret');

        if (!server || !port || !secret) return null;

        return { server, port, secret, original: link };
      } catch {
        return null;
      }
    }

    async function fetchNetworkInfo() {
      const btn = el('btn-check-net');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بررسی...';

      try {
        const res = await fetch('https://ipapi.co/json/');
        if (!res.ok) throw new Error();
        const data = await res.json();
        safeText(el('user-ip'), data.ip || 'Unknown');
        safeText(el('user-isp'), data.org || 'Unknown Provider');
        btn.className = 'flex items-center gap-1 bg-emerald-500/10 border border-emerald-500/20 px-3 py-2 rounded-xl text-green-400 text-[10px] font-bold shadow-inner';
        btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> بررسی شد';
      } catch {
        safeText(el('user-ip'), 'خطا در ارتباط');
        safeText(el('user-isp'), 'شبکه محلی / اختلال IP');
        btn.className = 'flex items-center gap-1 bg-red-500/10 border border-red-500/20 px-3 py-2 rounded-xl text-red-400 text-[10px] font-bold';
        btn.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> عدم موفقیت';
      }
    }

    async function fetchProxies() {
      try {
        el('update-status').innerHTML = '<i class="fa-solid fa-satellite-dish animate-pulse text-blue-400"></i> در حال تلاش برای اتصال به مخزن اول (CDN)...';
        let response = await fetch(primaryUrl);
        if (!response.ok) throw new Error('cdn fail');
        return await response.text();
      } catch {
        try {
          el('update-status').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> مخزن اول ناموفق بود. سوئیچ به مخزن پشتیبان (GitHub)...';
          const response = await fetch(fallbackUrl);
          if (!response.ok) throw new Error('fallback fail');
          return await response.text();
        } catch {
          el('loading-state').innerHTML = `
            <i class="fa-solid fa-circle-exclamation text-red-500 text-2xl mb-2"></i>
            <p class="text-xs text-red-400 font-mono">هر دو مخزن اصلی و پشتیبان روی شبکه شما مسدود هستند.</p>
          `;
          return '';
        }
      }
    }

    function normalizeLines(textData) {
      return textData
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.startsWith('tg://proxy') || line.startsWith('https://t.me/proxy'));
    }

    function buildProxyList(textData) {
      const lines = normalizeLines(textData);
      const uniqueLines = [...new Set(lines)];
      return uniqueLines
        .map((link, idx) => {
          const parsed = parseProxyLink(link);
          return parsed ? { ...parsed, id: idx, status: 'testing', ping: null } : null;
        })
        .filter(Boolean);
    }

    function updateCounters() {
      el('count-all').textContent = allProxies.length;
      el('count-alive').textContent = allProxies.filter(p => p.status === 'alive').length;
      el('count-dead').textContent = allProxies.filter(p => p.status === 'dead').length;
    }

    function getFilteredList() {
      const displayList = [...allProxies].sort((a, b) => {
        if (a.status === 'alive' && b.status === 'alive') return a.ping - b.ping;
        if (a.status === 'alive') return -1;
        if (b.status === 'alive') return 1;
        if (a.status === 'dead' && b.status !== 'dead') return 1;
        if (b.status === 'dead' && a.status !== 'dead') return -1;
        return 0;
      });

      return displayList.filter(p => {
        if (currentTab === 'all') return true;
        if (currentTab === 'alive') return p.status === 'alive';
        if (currentTab === 'dead') return p.status === 'dead';
        return true;
      });
    }

    function statusMeta(proxy) {
      if (proxy.status === 'alive') {
        let speedTag = '';
        if (proxy.ping < 120) speedTag = '<span class="bg-cyan-500/10 text-cyan-400 text-[9px] px-2 py-0.5 rounded-md font-bold">عالی ⚡</span>';
        else if (proxy.ping < 250) speedTag = '<span class="bg-emerald-500/10 text-emerald-400 text-[9px] px-2 py-0.5 rounded-md font-bold">خوب 🟢</span>';
        else speedTag = '<span class="bg-amber-500/10 text-amber-400 text-[9px] px-2 py-0.5 rounded-md font-bold">معمولی 🟡</span>';
        return {
          badgeClass: 'bg-green-500/10 text-green-400 border border-green-500/20 font-mono',
          badgeContent: `${proxy.ping} ms`,
          speedTag
        };
      }

      if (proxy.status === 'dead') {
        return {
          badgeClass: 'bg-red-500/10 text-red-400 border border-red-500/20',
          badgeContent: 'قطع ارتباط',
          speedTag: ''
        };
      }

      return {
        badgeClass: 'bg-slate-900 text-slate-500 border border-slate-800',
        badgeContent: '<i class="fa-solid fa-circle-notch fa-spin text-[9px] mr-1"></i> Checking',
        speedTag: ''
      };
    }

    function proxyCard(proxy) {
      const meta = statusMeta(proxy);
      const deadClass = proxy.status === 'dead' ? 'opacity-30 scale-[0.98]' : '';
      const connectClass = proxy.status === 'dead'
        ? 'pointer-events-none bg-slate-900 text-slate-600 border border-slate-900 shadow-none'
        : 'bg-blue-600 hover:bg-blue-500 text-white';

      const qrClass = proxy.status === 'dead' ? 'hidden' : '';

      const card = document.createElement('div');
      card.className = `glass-card rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden transition-all duration-300 ${deadClass}`;

      card.innerHTML = `
        <div class="absolute top-0 left-0 bg-slate-950/80 border-b border-r border-slate-900 text-slate-600 text-[9px] px-2 py-0.5 rounded-br-xl font-mono">#${proxy.id + 1}</div>
        <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5">
          ${meta.speedTag}
          <div class="${meta.badgeClass} text-[10px] px-2 py-0.5 rounded-md font-medium">${meta.badgeContent}</div>
        </div>

        <div class="mb-5 mt-6">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-8 h-8 rounded-xl bg-slate-950 flex items-center justify-center text-xs text-slate-400 border border-slate-900">
              <i class="fa-solid fa-network-wired"></i>
            </div>
            <div class="overflow-hidden flex-1">
              <h3 class="font-bold text-slate-300 text-xs font-mono truncate" title="${escapeHTML(proxy.server)}">${escapeHTML(proxy.server)}</h3>
              <p class="text-[10px] text-slate-500 mt-0.5">Port: <span class="font-mono text-slate-400">${escapeHTML(proxy.port)}</span></p>
            </div>
          </div>
          <div class="bg-slate-950/40 border border-slate-900 rounded-xl p-2.5 text-[10px] font-mono text-slate-500 flex justify-between items-center select-all">
            <span class="truncate pr-4"><span class="text-indigo-400/50">Secret:</span> ${escapeHTML(proxy.secret)}</span>
            <i class="fa-solid fa-key text-[9px] text-slate-700"></i>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <div class="grid grid-cols-2 gap-2">
            <button class="btn-copy flex items-center justify-center gap-1.5 bg-slate-950/80 hover:bg-slate-900 text-slate-400 hover:text-slate-200 py-2 px-3 rounded-xl text-xs font-medium border border-slate-900 transition-colors">
              <i class="fa-regular fa-copy"></i> کپی لینک
            </button>
            <a href="${proxy.original}" class="flex items-center justify-center gap-1.5 ${connectClass} py-2 px-3 rounded-xl text-xs font-bold transition-all" ${proxy.status === 'dead' ? '' : 'rel="noreferrer noopener"'}>
              <i class="fa-solid fa-bolt text-[10px]"></i> اتصال
            </a>
          </div>
          <button class="btn-qr flex items-center justify-center gap-1.5 bg-slate-900/60 hover:bg-slate-800 border border-slate-800/80 text-[11px] text-slate-400 py-2 rounded-xl transition-colors ${qrClass}">
            <i class="fa-solid fa-qrcode"></i> نمایش بارکد (QR Code)
          </button>
        </div>
      `;

      card.querySelector('.btn-copy').addEventListener('click', () => copySingle(proxy.original));
      card.querySelector('.btn-qr').addEventListener('click', () => openQRModal(proxy.original));

      return card;
    }

    function renderProxies() {
      const container = el('proxies-container');
      container.innerHTML = '';

      const filtered = getFilteredList();

      if (!filtered.length) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-600 text-xs font-medium">
            <i class="fa-solid fa-cubes-stacked text-xl mb-2 block"></i>
            هیچ پروکسی در این بخش یافت نشد.
          </div>
        `;
        return;
      }

      filtered.forEach(proxy => container.appendChild(proxyCard(proxy)));
    }

    async function measurePing(server) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000);
      const startTime = performance.now();

      try {
        await fetch(`https://${server}/favicon.ico?p=${Math.random()}`, {
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return Math.round(performance.now() - startTime);
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name !== 'AbortError') return Math.round(performance.now() - startTime);
        return null;
      }
    }

    async function startBulkPing() {
      const statusEl = el('update-status');
      if (statusEl) statusEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i> در حال بروزرسانی و پینگ‌سنجی پروکسی‌ها...';

      allProxies.forEach(p => { if (p.status !== 'alive') p.status = 'testing'; });
      updateCounters();
      renderProxies();

      const results = await Promise.all(allProxies.map(async (proxy) => {
        const ping = await measurePing(proxy.server);
        if (ping !== null) return { proxy, status: 'alive', ping };
        return { proxy, status: 'dead', ping: null };
      }));

      results.forEach(({ proxy, status, ping }) => {
        proxy.status = status;
        proxy.ping = ping;
      });

      updateCounters();
      renderProxies();

      if (statusEl) statusEl.innerHTML = '<i class="fa-solid fa-circle-check text-green-400"></i> پینگ‌سنجی با موفقیت روی اپراتور شما انجام شد.';
      el('btn-bulk-copy').classList.toggle('hidden', !allProxies.some(p => p.status === 'alive'));
    }

    function switchTab(tab) {
      currentTab = tab;
      ['all', 'alive', 'dead'].forEach(t => {
        const btn = el(`tab-${t}`);
        btn.classList.remove('active-tab');
        btn.classList.add('text-slate-400');
      });

      const active = el(`tab-${tab}`);
      active.classList.add('active-tab');
      active.classList.remove('text-slate-400');
      renderProxies();
    }

    function copySingle(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('پروکسی با موفقیت کپی شد 📋');
      });
    }

    function copyAllAlive() {
      const aliveProxies = allProxies.filter(p => p.status === 'alive').sort((a, b) => a.ping - b.ping);
      if (!aliveProxies.length) return;
      navigator.clipboard.writeText(aliveProxies.map(p => p.original).join('\n')).then(() => {
        showToast(`تعداد ${aliveProxies.length} پروکسی برتر یکجا کپی شد 🚀`);
      });
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-6 bg-slate-950 border border-slate-800 text-slate-200 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold z-50 transition-all duration-300 transform translate-y-4 opacity-0';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 100);
      setTimeout(() => {
        toast.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function openQRModal(link) {
      currentQRLink = link;
      const modal = el('qr-modal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        el('qr-modal-panel').classList.remove('scale-95');
      }, 10);

      new QRious({
        element: el('qr-canvas'),
        value: link,
        size: 180,
        background: '#ffffff',
        foreground: '#0f172a'
      });
    }

    function closeQRModal() {
      const modal = el('qr-modal');
      modal.classList.add('opacity-0');
      el('qr-modal-panel').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    async function init() {
      el('btn-check-net').addEventListener('click', fetchNetworkInfo);
      el('btn-bulk-copy').addEventListener('click', copyAllAlive);
      el('btn-refresh').addEventListener('click', startBulkPing);
      el('btn-close-qr').addEventListener('click', closeQRModal);
      el('qr-modal').addEventListener('click', (e) => {
        if (e.target.id === 'qr-modal') closeQRModal();
      });

      ['tab-all', 'tab-alive', 'tab-dead'].forEach(id => {
        el(id).addEventListener('click', () => switchTab(el(id).dataset.tab));
      });

      const textData = await fetchProxies();
      if (!textData) return;

      allProxies = buildProxyList(textData);
      updateCounters();
      el('loading-state').style.display = 'none';
      renderProxies();
      startBulkPing();
    }

    init();
  </script>
</body>
</html>
